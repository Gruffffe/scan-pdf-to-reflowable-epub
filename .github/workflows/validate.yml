name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install required Python dependency
        run: python -m pip install -r requirements.txt

      - name: Check repository structure and privacy patterns
        run: python scripts/repo_check.py

      - name: Run synthetic EPUB smoke test
        run: python tests/smoke_test.py

      - name: Run reflow-audit regression test
        run: python tests/reflow_audit_test.py

      - name: Run content-inventory regression test
        run: python tests/content_inventory_test.py
